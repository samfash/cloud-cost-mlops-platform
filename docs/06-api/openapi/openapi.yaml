openapi: 3.1.0
info:
  title: Cloud Cost Prediction & Model Lab APIs
  version: 1.0.0
  description: |
    OpenAPI-ish description of the **implemented** Flask services.
    Inference (:8080) predicts VM cost from a sealed CAS RandomForest bundle.
    Model lab (:8081) elects RandomForest trials via REXX Borda/Copeland.
  contact:
    name: Platform
x-portfolio-status: Implemented
x-last-updated: 2026-08-09
servers:
  - url: http://localhost:8080
    description: Cloud-cost inference
  - url: http://localhost:8081
    description: Model lab election
tags:
  - name: inference
  - name: model-lab
paths:
  /:
    get:
      tags: [inference]
      summary: HTML prediction form
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: HTML UI
          content:
            text/html:
              schema:
                type: string
  /health:
    get:
      tags: [inference]
      summary: Inference health and bundle metadata
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: Health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceHealth"
    # model-lab also exposes GET /health on :8081
  /predict:
    post:
      tags: [inference]
      summary: Form-encoded prediction returning HTML
      servers:
        - url: http://localhost:8080
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PredictFeatures"
      responses:
        "200":
          description: HTML results page
        "500":
          description: Model unavailable or prediction error
  /api/predict:
    post:
      tags: [inference]
      summary: JSON prediction
      servers:
        - url: http://localhost:8080
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictFeatures"
            example:
              timestamp: "1/1/2024 0:00"
              cpu_usage: 43.71
              memory_usage: 95.56
              net_io: 379.4
              disk_io: 638.79
              RAM_GB: 1
              vCPU: 1
              latency_ms: 228.02
              throughput: 1380.99
              utilization: 69.64
              cloud_provider: Azure
              region: us-east
              vm_type: t2.micro
              target: scale_up
      responses:
        "200":
          description: Prediction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/select:
    post:
      tags: [model-lab]
      summary: Elect a trial via REXX Borda/Copeland
      servers:
        - url: http://localhost:8081
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectRequest"
      responses:
        "200":
          description: Chosen trial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectResponse"
components:
  schemas:
    PredictFeatures:
      type: object
      required:
        - timestamp
        - cpu_usage
        - memory_usage
        - net_io
        - disk_io
        - RAM_GB
        - vCPU
        - latency_ms
        - throughput
        - utilization
        - cloud_provider
        - region
        - vm_type
        - target
      properties:
        timestamp:
          type: string
          example: "1/1/2024 0:00"
        cpu_usage:
          type: number
        memory_usage:
          type: number
        net_io:
          type: number
        disk_io:
          type: number
        RAM_GB:
          type: number
        vCPU:
          type: number
        latency_ms:
          type: number
        throughput:
          type: number
        utilization:
          type: number
        cloud_provider:
          type: string
        region:
          type: string
        vm_type:
          type: string
        target:
          type: string
          description: Operational target label (e.g. scale_up)
        price_per_hour:
          type: number
          description: Optional depending on transform expectations
    PredictResponse:
      type: object
      properties:
        prediction:
          type: number
          description: Predicted VM cost
        status:
          type: string
          example: success
    InferenceHealth:
      type: object
      properties:
        model_loaded:
          type: boolean
        bundle_dir:
          type: string
          nullable: true
        model_version:
          type: string
          nullable: true
        bundle_exists:
          type: boolean
        bundle_files:
          type: array
          items:
            type: string
        metrics:
          type: object
          additionalProperties:
            type: number
    SelectRequest:
      type: object
      properties:
        trials_dir:
          type: string
          description: Optional override path to trials
        constraints_path:
          type: string
          description: Optional override path to constraints YAML
    SelectResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        chosen:
          type: object
          additionalProperties: true
    Error:
      type: object
      properties:
        error:
          type: string
