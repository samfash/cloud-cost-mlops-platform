openapi: 3.1.0
info:
  title: Cloud Cost Prediction & Model Lab APIs
  version: 1.4.0
  description: |
    Flask services for VM cloud-cost inference (CAS RandomForest) and model-lab trial election.
    Additive fields do not break clients that only read `prediction` + `status`.

    UI: `/` overview, `/estimate` calculator.
    Batch: `POST /api/predict/batch`. Ops: `/ops/model-card`.
    Optional canary/shadow via SERVING_MODE + CAS probe pin.
    Optional API_KEY; Compose RATE_LIMIT_PER_MINUTE default 600.
  contact:
    name: Platform
x-portfolio-status: Implemented
x-last-updated: 2026-08-10
servers:
  - url: http://localhost:8080
    description: Cloud-cost inference
  - url: http://localhost:8081
    description: Model lab election
tags:
  - name: inference
  - name: ops
  - name: model-lab
paths:
  /:
    get:
      tags: [inference]
      summary: Non-technical product overview (HTML)
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: HTML overview
  /estimate:
    get:
      tags: [inference]
      summary: Cost estimate wizard (HTML)
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: HTML estimate form
  /health:
    get:
      tags: [ops]
      summary: Liveness / metadata (always 200 if process up)
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: Health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceHealth"
  /ready:
    get:
      tags: [ops]
      summary: Readiness probe (model must be loaded)
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: Ready
        "503":
          description: Model not loaded
  /metrics:
    get:
      tags: [ops]
      summary: Prometheus metrics
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /predict:
    post:
      tags: [inference]
      summary: Form-encoded prediction returning HTML
      servers:
        - url: http://localhost:8080
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PredictFeatures"
      responses:
        "200":
          description: HTML results page
        "400":
          description: Validation error
        "503":
          description: Model unavailable
        "500":
          description: Prediction error
  /api/predict:
    post:
      tags: [inference]
      summary: JSON prediction
      servers:
        - url: http://localhost:8080
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - {}
      parameters:
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictFeatures"
            example:
              timestamp: "1/1/2024 0:00"
              cpu_usage: 43.71
              memory_usage: 95.56
              net_io: 379.4
              disk_io: 638.79
              RAM_GB: 1
              vCPU: 1
              latency_ms: 228.02
              throughput: 1380.99
              utilization: 69.64
              cloud_provider: Azure
              region: us-east
              vm_type: t2.micro
              target: scale_up
      responses:
        "200":
          description: Prediction result
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Model unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized (only when API_KEY is configured)
        "429":
          description: Rate limited (only when RATE_LIMIT_PER_MINUTE > 0)
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/predict/batch:
    post:
      tags: [inference]
      summary: Batch JSON predictions
      servers:
        - url: http://localhost:8080
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instances]
              properties:
                instances:
                  type: array
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/PredictFeatures"
      responses:
        "200":
          description: Batch results
        "400":
          description: Invalid batch body
        "503":
          description: Model unavailable
  /ops/model-card:
    get:
      tags: [ops]
      summary: Offline metrics + online serving posture
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: Model card JSON
        "503":
          description: Model unavailable
  /api/select:
    post:
      tags: [model-lab]
      summary: Elect a trial via REXX Borda/Copeland
      servers:
        - url: http://localhost:8081
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectRequest"
      responses:
        "200":
          description: Chosen trial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized (only when API_KEY is configured)
        "429":
          description: Rate limited (only when RATE_LIMIT_PER_MINUTE > 0)
        "500":
          description: Election failure
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    PredictFeatures:
      type: object
      required:
        - timestamp
        - cpu_usage
        - memory_usage
        - net_io
        - disk_io
        - RAM_GB
        - vCPU
        - latency_ms
        - throughput
        - utilization
        - cloud_provider
        - region
        - vm_type
        - target
      properties:
        timestamp:
          type: string
          example: "1/1/2024 0:00"
        cpu_usage:
          type: number
        memory_usage:
          type: number
        net_io:
          type: number
        disk_io:
          type: number
        RAM_GB:
          type: number
        vCPU:
          type: number
        latency_ms:
          type: number
        throughput:
          type: number
        utilization:
          type: number
        cloud_provider:
          type: string
        region:
          type: string
        vm_type:
          type: string
        target:
          type: string
          description: Operational target label (e.g. scale_up)
    PredictResponse:
      type: object
      required: [prediction, status]
      properties:
        prediction:
          type: number
          description: Predicted VM cost
        status:
          type: string
          example: success
        model_version:
          type: string
          description: Additive field — CAS bundle version
        request_id:
          type: string
          description: Additive field — correlation id
        latency_ms:
          type: number
          description: Additive field — server-side predict latency
        cache_hit:
          type: boolean
          description: Additive field — true when served from in-process cache
        variant:
          type: string
          description: primary or canary
    InferenceHealth:
      type: object
      properties:
        model_loaded:
          type: boolean
        status:
          type: string
        service:
          type: string
        bundle_dir:
          type: string
          nullable: true
        model_version:
          type: string
          nullable: true
        bundle_exists:
          type: boolean
        bundle_files:
          type: array
          items:
            type: string
        metrics:
          type: object
          additionalProperties:
            type: number
    SelectRequest:
      type: object
      properties:
        trials_dir:
          type: string
        constraints_path:
          type: string
    SelectResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        chosen:
          type: object
          additionalProperties: true
        request_id:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
        request_id:
          type: string
