# Render Blueprint — v1 cloud-cost inference API (Free-first)
# Docs: docs/07-infrastructure/render/deploy-v1.md
#
# Free = 512MB RAM. Env vars below are also passed as Docker build-args.
services:
  - type: web
    name: cloud-cost-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: PYTHONPATH
        value: /app:/app/cloud-cost
      - key: LOG_LEVEL
        value: INFO
      - key: SPLIT_MODE
        value: temporal
      - key: SERVING_MODE
        value: primary
      - key: CANARY_PERCENT
        value: "0"
      - key: LATENCY_MODEL_ENABLED
        value: "1"
      - key: PREDICT_CACHE_ENABLED
        value: "1"
      - key: PREDICT_CACHE_SIZE
        value: "256"
      - key: PREDICT_CACHE_TTL_SECONDS
        value: "300"
      - key: ASYNC_JOBS_ENABLED
        value: "1"
      - key: AUDIT_LOG_ENABLED
        value: "1"
      - key: AUDIT_LOG_PATH
        value: /tmp/predict_audit.db
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: GUNICORN_THREADS
        value: "2"
      # Slim build for Free: less RAM/time (also injected as Docker build-args).
      - key: RENDER_SLIM_BUILD
        value: "1"
      - key: SKIP_MODEL_LAB_BUILD
        value: "1"
      - key: INSTALL_PYTEST
        value: "0"
      - key: RF_N_JOBS
        value: "1"
      - key: RF_N_ESTIMATORS
        value: "80"
      - key: API_KEY
        sync: false
