global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cloud-cost-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: cloud-cost-api

  - job_name: model-lab-api
    metrics_path: /metrics
    static_configs:
      - targets: ["model-lab:8081"]
        labels:
          service: model-lab-api
