artifacts_root: artifacts
 
data_validation:
  root_dir: artifacts/data_validation
  local_data_file: dataset/Cloud_Dataset.csv
  STATUS_FILE: artifacts/data_validation/status.txt

data_transformation:
  root_dir: artifacts/data_transformation
  data_path: dataset/Cloud_Dataset.csv

model_trainer:
  root_dir: artifacts/model_trainer
  train_data_path: artifacts/data_transformation/train.csv
  test_data_path: artifacts/data_transformation/test.csv
  model_name: model.pkl

model_evaluation:
  root_dir: artifacts/model_evaluation
  test_data_path: artifacts/data_transformation/test.csv
  model_path: artifacts/model_trainer/model.pkl
  metric_file_name: artifacts/model_evaluation/metrics.json

model_packager:
  root_dir: artifacts/model_bundle
  model_path: artifacts/model_trainer/model.pkl
  label_encoders_path: artifacts/data_transformation/label_encoders.pkl
  feature_schema_path: artifacts/data_transformation/feature_columns.json
  metrics_path: artifacts/model_evaluation/metrics.json
  r2_minor_bump_threshold: 0.05
  r2_major_bump_threshold: 0.15
  mae_regression_tolerance: 0.05
  r2_floor: 0.0
  mae_ceiling: 1.0e9
  allow_nonimproving_patch: true
