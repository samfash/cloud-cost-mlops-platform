<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Cloud Cost{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('overview') }}">Cloud<span>Cost</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ url_for('overview') }}" class="{% if active == 'overview' %}active{% endif %}">Overview</a>
      <a href="{{ url_for('home') }}" class="{% if active == 'estimate' %}active{% endif %}">Estimate</a>
      <a href="/health" target="_blank" rel="noopener">API status</a>
      <a class="cta" href="{{ url_for('home') }}">Run estimate</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div>CloudCost · VM cost prediction for FinOps teams</div>
    <div>Model served from sealed CAS bundle</div>
  </footer>
</body>
</html>
