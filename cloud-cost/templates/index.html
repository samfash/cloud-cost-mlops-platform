{% extends "base.html" %}
{% block title %}CloudCost · Estimate{% endblock %}
{% block content %}
<section class="shell">
  <div class="panel">
    <div class="wizard-head">
      <div>
        <h1>Cost estimate</h1>
        <p>Five short steps. Same model as the JSON API.</p>
      </div>
      <a href="{{ url_for('overview') }}">Need the plain-language tour?</a>
    </div>

    <div class="steps" aria-label="Progress">
      <span class="step-pill active" data-step="1">Usage</span>
      <span class="step-pill" data-step="2">Capacity</span>
      <span class="step-pill" data-step="3">Timing</span>
      <span class="step-pill" data-step="4">Provider</span>
      <span class="step-pill" data-step="5">Shape</span>
    </div>

    <form id="costForm" action="/predict" method="post">
      <div class="form-page active" id="page1">
        <div class="grid-2">
          <div class="field">
            <label for="cpu_usage">CPU usage (%)</label>
            <input id="cpu_usage" type="number" step="0.01" name="cpu_usage" required>
          </div>
          <div class="field">
            <label for="memory_usage">Memory usage (%)</label>
            <input id="memory_usage" type="number" step="0.01" name="memory_usage" required>
          </div>
          <div class="field">
            <label for="net_io">Network I/O</label>
            <input id="net_io" type="number" step="0.01" name="net_io" required>
          </div>
          <div class="field">
            <label for="disk_io">Disk I/O</label>
            <input id="disk_io" type="number" step="0.01" name="disk_io" required>
          </div>
        </div>
        <div class="field">
          <label for="utilization">Utilization (%)</label>
          <input id="utilization" type="number" step="0.01" name="utilization" required>
        </div>
        <div class="nav-row">
          <span></span>
          <button type="button" class="btn btn-primary" onclick="nextPage()">Continue</button>
        </div>
      </div>

      <div class="form-page" id="page2">
        <div class="grid-2">
          <div class="field">
            <label for="vCPU">vCPU count</label>
            <input id="vCPU" type="number" name="vCPU" required>
          </div>
          <div class="field">
            <label for="RAM_GB">RAM (GB)</label>
            <input id="RAM_GB" type="number" step="0.1" name="RAM_GB" required>
          </div>
          <div class="field">
            <label for="latency_ms">Latency (ms)</label>
            <input id="latency_ms" type="number" step="0.01" name="latency_ms" required>
          </div>
          <div class="field">
            <label for="throughput">Throughput</label>
            <input id="throughput" type="number" step="0.01" name="throughput" required>
          </div>
        </div>
        <div class="nav-row">
          <button type="button" class="btn btn-ghost" onclick="prevPage()">Back</button>
          <button type="button" class="btn btn-primary" onclick="nextPage()">Continue</button>
        </div>
      </div>

      <div class="form-page" id="page3">
        <div class="field">
          <label for="datetime">Date and time</label>
          <input type="datetime-local" id="datetime" onchange="updateTimeFields()" required>
        </div>
        <div class="grid-2">
          <div class="field"><label for="hour">Hour</label><input type="number" name="hour" id="hour" readonly></div>
          <div class="field"><label for="day">Day</label><input type="number" name="day" id="day" readonly></div>
          <div class="field"><label for="month">Month</label><input type="number" name="month" id="month" readonly></div>
          <div class="field"><label for="day_of_week">Day of week</label><input type="number" name="day_of_week" id="day_of_week" readonly></div>
          <div class="field"><label for="is_weekend">Weekend flag</label><input type="number" name="is_weekend" id="is_weekend" readonly></div>
        </div>
        <div class="nav-row">
          <button type="button" class="btn btn-ghost" onclick="prevPage()">Back</button>
          <button type="button" class="btn btn-primary" onclick="nextPage()">Continue</button>
        </div>
      </div>

      <div class="form-page" id="page4">
        <div class="field">
          <label>Cloud provider</label>
          <div class="choice-grid">
            <label class="choice"><input type="radio" name="cloud_provider" value="AWS" required><span>AWS</span></label>
            <label class="choice"><input type="radio" name="cloud_provider" value="Azure"><span>Azure</span></label>
            <label class="choice"><input type="radio" name="cloud_provider" value="GCP"><span>GCP</span></label>
          </div>
        </div>
        <div class="nav-row">
          <button type="button" class="btn btn-ghost" onclick="prevPage()">Back</button>
          <button type="button" class="btn btn-primary" onclick="nextPage()">Continue</button>
        </div>
      </div>

      <div class="form-page" id="page5">
        <div class="field">
          <label>Region</label>
          <div class="choice-grid">
            <label class="choice"><input type="radio" name="region" value="asia-south" required><span>Asia South</span></label>
            <label class="choice"><input type="radio" name="region" value="us-east"><span>US East</span></label>
            <label class="choice"><input type="radio" name="region" value="us-west"><span>US West</span></label>
          </div>
        </div>
        <div class="field">
          <label>VM type</label>
          <div class="choice-grid">
            <label class="choice"><input type="radio" name="vm_type" value="B1s" required><span>B1s</span></label>
            <label class="choice"><input type="radio" name="vm_type" value="n1-standard-1"><span>n1-standard-1</span></label>
            <label class="choice"><input type="radio" name="vm_type" value="t2.micro"><span>t2.micro</span></label>
          </div>
        </div>
        <div class="field">
          <label>Optimization target</label>
          <div class="choice-grid">
            <label class="choice"><input type="radio" name="target" value="no_action" required><span>No action</span></label>
            <label class="choice"><input type="radio" name="target" value="scale_down"><span>Scale down</span></label>
            <label class="choice"><input type="radio" name="target" value="scale_up"><span>Scale up</span></label>
          </div>
        </div>
        <div class="nav-row">
          <button type="button" class="btn btn-ghost" onclick="prevPage()">Back</button>
          <button type="submit" class="btn btn-primary">Calculate cost</button>
        </div>
      </div>
    </form>
  </div>
</section>
<script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
{% endblock %}
