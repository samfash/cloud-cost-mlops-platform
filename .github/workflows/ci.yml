name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends regina-rexx git

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/cloud-cost
        run: pytest tests/unit -q

      - name: Train + package (smoke)
        working-directory: cloud-cost
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/cloud-cost
          SPLIT_MODE: temporal
        run: python main.py

      - name: ML metrics gate
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/cloud-cost
        run: python scripts/check_metrics_gate.py

      - name: CAS backup/restore drill
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/cloud-cost
        run: |
          chmod +x scripts/backup_cas.sh scripts/restore_cas.sh
          ./scripts/backup_cas.sh
          ARCHIVE="$(ls -1t backups/model_bundle_*.tar.gz | head -n1)"
          test -f "$ARCHIVE"
          test -f "$ARCHIVE.sha256"
          # Corrupt live HEAD then restore from archive
          rm -rf cloud-cost/artifacts/model_bundle
          ./scripts/restore_cas.sh "$ARCHIVE"
          test -f cloud-cost/artifacts/model_bundle/HEAD

      - name: Model lab submission
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/cloud-cost
        run: python -m model_lab.cli

      - name: API + model-lab smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/cloud-cost
        run: pytest tests/integration -q -m "not slow"

      - name: Docker build
        run: docker build -t cloud-cost-api:ci .

      - name: Docker compose smoke
        run: |
          docker compose up -d api model-lab
          # wait for readiness
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ready && curl -fsS http://127.0.0.1:8081/ready; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/metrics | grep -q model_loaded
          curl -fsS http://127.0.0.1:8080/ | grep -q "Know what a cloud server may cost"
          curl -fsS http://127.0.0.1:8080/estimate | grep -q "Cost estimate"
          curl -fsS -X POST http://127.0.0.1:8080/api/predict \
            -H "Content-Type: application/json" \
            -d '{"timestamp":"1/1/2024 0:00","cpu_usage":43.71,"memory_usage":95.56,"net_io":379.4,"disk_io":638.79,"RAM_GB":1,"vCPU":1,"latency_ms":228.02,"throughput":1380.99,"utilization":69.64,"cloud_provider":"Azure","region":"us-east","vm_type":"t2.micro","target":"scale_up"}' \
            | grep -q '"status":"success"'
          curl -fsS -X POST http://127.0.0.1:8080/api/predict/batch \
            -H "Content-Type: application/json" \
            -d '{"instances":[{"timestamp":"1/1/2024 0:00","cpu_usage":43.71,"memory_usage":95.56,"net_io":379.4,"disk_io":638.79,"RAM_GB":1,"vCPU":1,"latency_ms":228.02,"throughput":1380.99,"utilization":69.64,"cloud_provider":"Azure","region":"us-east","vm_type":"t2.micro","target":"scale_up"}]}' \
            | grep -q '"count":1'
          curl -fsS http://127.0.0.1:8080/ops/model-card | grep -q '"task":"regression"'
          curl -fsS -X POST http://127.0.0.1:8081/api/select \
            -H "Content-Type: application/json" \
            -d '{}' | grep -q trial_200
          # Observability profile: Prometheus loads alert rules
          docker compose --profile obs up -d prometheus
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9090/-/ready; then
              break
            fi
            sleep 2
          done
          curl -fsS 'http://127.0.0.1:9090/api/v1/rules' | grep -q CloudCostModelNotLoaded
          docker compose --profile obs down -v

      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloud-cost-api:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.11.0
      - run: ruff check cloud-cost/src cloud-cost/app.py model_lab tests/unit tests/integration
